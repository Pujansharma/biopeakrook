[project]
name = "biopeak-nexus-fe"
version = "0.2.0"
description = "Biopeak Nexus Interface Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django",
    "django-cors-headers",
    "django-debug-toolbar",
    "djangorestframework",
    "djangorestframework-stubs",
    "djangorestframework-simplejwt",
    "gunicorn",
    "ipython",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langfuse>=3.0,<4.0",
    "nest-asyncio>=1.6",
    "pydantic>=2.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "phonenumbers",
    "pillow",
    "psycopg",
    "python-decouple",
    "requests",
    "whitenoise",
    "pandas",
    "pandas-stubs",
    "pyotp",
    "qrcode",
    "django-storages[s3]",
    "arrow",
    "firebase-admin",
    "drf-spectacular>=0.29.0",
    "ruff",
    "python-dotenv>=1.2.2",
    "pillow-heif>=1.4.0",
]


[tool.ruff]
extend-exclude = ["migrations"]
