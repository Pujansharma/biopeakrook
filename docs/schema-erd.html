  #toolbar { position: fixed; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; }

  #toolbar span { font-size: 12px; color: #8892a6; }
  #legend { position: fixed; top: 12px; right: 12px; z-index: 10; background: #1b1f2a; border: 1px solid #333a4a; border-radius: 8px; padding: 10px 12px; max-height: 90vh; overflow-y: auto; font-size: 12px; }
  #legend h3 { margin: 0 0 6px; font-size: 12px; color: #8892a6; text-transform: uppercase; letter-spacing: .05em; }
  .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; cursor: pointer; opacity: 1; }
  .legend-item.dimmed { opacity: 0.3; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  svg { width: 100vw; height: 100vh; display: block; }
  .link { stroke: #555f75; stroke-opacity: 0.55; fill: none; }
  .link.m2m { stroke-width: 2.5; stroke-dasharray: none; }
  .link.one { stroke-dasharray: 4 3; }
  .link.dimmed { stroke-opacity: 0.06; }
  .link-label { pointer-events: none; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 8px; fill: #b7c0d4; paint-order: stroke; stroke: #0f1117; stroke-width: 3px; stroke-linejoin: round; }
  .link-label.dimmed { opacity: 0.06; }
  .node circle { stroke: #0f1117; stroke-width: 1.5px; cursor: grab; }
  .node text { fill: #e6e6e6; font-size: 10px; pointer-events: none; }
  .node.dimmed circle { opacity: 0.15; }
  .node.dimmed text { opacity: 0.15; }
  .node.hidden, .link.hidden, .link-label.hidden { display: none; }
  #tooltip { position: fixed; pointer-events: none; background: #1b1f2a; border: 1px solid #333a4a; border-radius: 6px; padding: 6px 9px; font-size: 12px; display: none; z-index: 20; }
  #card { position: fixed; pointer-events: none; background: #171a22; border: 1px solid #333a4a; border-radius: 8px; padding: 0; font-size: 12px; display: none; z-index: 21; width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
  #card .card-head { padding: 8px 10px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #card .card-title { font-size: 13px; font-weight: 600; color: #fff; }
  #card .card-sub { font-size: 10px; color: #8892a6; margin-top: 1px; }
  #card .card-rows { max-height: 320px; overflow-y: auto; border-top: 1px solid #2a2f3d; }
  #card .card-row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 10px; }
  #card .card-row:nth-child(odd) { background: #1b1f2a; }
  #card .card-row.pk .fname { color: #f5c451; }
  #card .fname { color: #d7dbe6; white-space: nowrap; }
  #card .ftype { color: #6fb6ff; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

// --- Rendering ---

const color = d3.scaleOrdinal().domain(groups).range(
  groups.map((_, i) => d3.hsl(i * 360 / groups.length, 0.55, 0.58).formatHex())
);

const degree = new Map(nodes.map(n => [n.id, 0]));
links.forEach(l => { degree.set(l.source, (degree.get(l.source) || 0) + 1); degree.set(l.target, (degree.get(l.target) || 0) + 1); });

const svg = d3.select("svg");
const width = window.innerWidth, height = window.innerHeight;
const container = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.1, 4]).on("zoom", (e) => container.attr("transform", e.transform)));

svg.append("defs").append("marker")
  .attr("id", "arrow").attr("viewBox", "0 -5 10 10").attr("refX", 20).attr("refY", 0)
  .attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
  .append("path").attr("d", "M0,-5L10,0L0,5").attr("fill", "#555f75");

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(90).strength(0.35))
  .force("charge", d3.forceManyBody().strength(-260))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collide", d3.forceCollide(d => 10 + Math.sqrt(degree.get(d.id) || 1) * 3));

const link = container.append("g").selectAll("path")
  .data(links).join("path")
  .attr("class", d => "link " + d.type)
  .attr("marker-end", "url(#arrow)");

const linkLabel = container.append("g").selectAll("text")
  .data(links).join("text")
  .attr("class", "link-label")
  .attr("text-anchor", "middle")
  .text(d => d.field);

const node = container.append("g").selectAll("g")
  .data(nodes).join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

node.append("circle")
  .attr("r", d => 6 + Math.sqrt(degree.get(d.id) || 1) * 2.2)
  .attr("fill", d => color(d.group));

node.append("text")
  .attr("dy", d => -(9 + Math.sqrt(degree.get(d.id) || 1) * 2.2))
  .attr("text-anchor", "middle")
  .text(d => d.id);

const tooltip = d3.select("#tooltip");
link.on("mousemove", (e, d) => {
    tooltip.style("display", "block").style("left", e.clientX + 14 + "px").style("top", e.clientY + 10 + "px")
      .html(`<b>${d.source.id}</b>.${d.field} → <b>${d.target.id}</b><br>${d.type === "m2m" ? "many-to-many" : d.type === "one" ? "one-to-one" : "many-to-one"}`);
  })
  .on("mouseleave", () => tooltip.style("display", "none"));

const card = d3.select("#card");

function renderCard(e, d) {
  const def = fieldDefs[d.id];
  const rowsHtml = def
    ? def.rows.map(([name, type]) =>
        `<div class="card-row${name === def.pk ? " pk" : ""}"><span class="fname">${name === def.pk ? "🔑 " : ""}${name}</span><span class="ftype">${type}</span></div>`
      ).join("")
    : "";
  card.html(`
    <div class="card-head" style="border-left:3px solid ${color(d.group)}">
      <div class="card-title">${d.id}</div>
      <div class="card-sub">${d.group} · ${degree.get(d.id) || 0} connection(s)</div>
    </div>
    <div class="card-rows">${rowsHtml}</div>
  `);
  positionCard(e);
  card.style("display", "block");
}

function positionCard(e) {
  const cardW = 260, cardH = card.node().offsetHeight || 200;
  let left = e.clientX + 16, top = e.clientY;
  if (left + cardW > window.innerWidth) left = e.clientX - cardW - 16;
  if (top + cardH > window.innerHeight) top = window.innerHeight - cardH - 8;
  card.style("left", left + "px").style("top", top + "px");
}

node.on("mousemove", (e, d) => { renderCard(e, d); })
  .on("mouseleave", () => card.style("display", "none"));

sim.on("tick", () => {
  link.attr("d", d => `M${d.source.x},${d.source.y}L${d.target.x},${d.target.y}`);
  linkLabel
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2);
  node.attr("transform", d => `translate(${d.x},${d.y})`);
});

// --- Legend + filtering ---

const legendBody = d3.select("#legend-body");
const activeGroups = new Set(groups);

legendBody.selectAll(".legend-item").data(groups).join("div")
  .attr("class", "legend-item")
  .on("click", function (e, g) {
    if (activeGroups.has(g)) activeGroups.delete(g); else activeGroups.add(g);
    d3.select(this).classed("dimmed", !activeGroups.has(g));
    applyFilter();
  })
  .html(g => `<span class="legend-swatch" style="background:${color(g)}"></span>${g}`);

function applyFilter() {
  const term = d3.select("#search").property("value").trim().toLowerCase();

  const nodeHidden = d => !activeGroups.has(d.group);
  node.classed("hidden", nodeHidden);
  node.classed("dimmed", d => !nodeHidden(d) && term && !d.id.toLowerCase().includes(term));

  const linkHidden = d => !activeGroups.has(d.source.group) || !activeGroups.has(d.target.group);
  const linkDimmed = d => !linkHidden(d) && term &&
    !d.source.id.toLowerCase().includes(term) && !d.target.id.toLowerCase().includes(term);
  link.classed("hidden", linkHidden).classed("dimmed", linkDimmed);
  linkLabel.classed("hidden", linkHidden).classed("dimmed", linkDimmed);
}

d3.select("#search").on("input", applyFilter);
d3.select("#count").text(`${nodes.length} tables · ${links.length} connections`);
</script>
